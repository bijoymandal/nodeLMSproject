version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: mongo_container
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      target: prod
    container_name: backend_container
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3400:5000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules # prevents overwriting node_modules inside container
    command: npm run dev # hot reload with nodemon (only in dev mode)

volumes:
  mongo-data:

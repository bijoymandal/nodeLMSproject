version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: mongo_container
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      target: prod
    container_name: backend_container
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3400:5000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # ---------- Production backend ----------
  backend-prod:
    build:
      context: ./backend
      target: prod
    container_name: backend_prod_container
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3400:3400"
    depends_on:
      - mongo
    command: npm start
    extends: service:backend-dev

  # ---------- Development frontend ----------
  frontend-dev:
    build:
      context: ./frontend
      target: dev
    container_name: frontend_dev_container
    restart: always
    ports:
      - "3001:5173" # Vite dev server
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # ---------- Production frontend ----------
  frontend-prod:
    build:
      context: ./frontend
      target: prod
    container_name: frontend_prod_container
    restart: always
    ports:
      - "3000:80" # Nginx serving built React app
    depends_on:
      - backend

  # ---------- Alias frontend (defaults to dev) ----------
  frontend:
    extends:
      service: frontend-dev

volumes:
  mongo-data:
